version: "3.9"

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant

    ports:
      - "6333:6333"

    volumes:
      - ./qdrant_storage:/qdrant/storage

    restart: unless-stopped    

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n

    environment:
      - N8N_ENABLE_EXECUTE_COMMAND=true
      - NODES_EXCLUDE=[]


    ports:
      - "5678:5678"

    restart: unless-stopped

    volumes:
      - n8n_data:/home/node/.n8n
      - YOUR_PROJECT_PATH:/home/node/.n8n-files/PersisApps
      - YOUR_KNOWLEDGE BASE_PATH:/home/node/.n8n-files/Knowledge_base

volumes:
  n8n_data:
    external: true
    name : n8n_data